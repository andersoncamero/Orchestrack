syntax = "proto3";

package orchestrack.docker;

import "proto/system/system.proto";

option go_package = "github.com/go/orchestrack/backend/proto/docker;docker";

// Información de registro/heartbeat de una instancia de docker-service.
message DockerServiceHeartbeat {
  string service_id = 1;
  string hostname = 2;
  string status = 3; // online, offline
  int64 timestamp = 4;

  // Métricas del host asociado a esta instancia.
  orchestrack.system.HostMetrics host_metrics = 5;
}

// Respuesta de un comando enviado por NATS request-reply.
message CommandResponse {
  bool success = 1;
  string error_message = 2;
  bytes payload = 3; // Mensaje protobuf serializado
}
