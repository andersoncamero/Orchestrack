syntax = "proto3";

package orchestrack.system;

option go_package = "github.com/go/orchestrack/backend/proto/system;system";

// Gestor de paquetes detectado en el host.
enum PackageManager {
  PACKAGE_MANAGER_UNSPECIFIED = 0;
  PACKAGE_MANAGER_APT = 1;   // Debian/Ubuntu
  PACKAGE_MANAGER_DNF = 2;   // Fedora/RHEL 8+
  PACKAGE_MANAGER_YUM = 3;   // RHEL/CentOS legacy
  PACKAGE_MANAGER_PACMAN = 4; // Arch/Manjaro
  PACKAGE_MANAGER_APK = 5;    // Alpine
  PACKAGE_MANAGER_BREW = 6;   // macOS
  PACKAGE_MANAGER_CHOCO = 7;  // Windows
  PACKAGE_MANAGER_WINGET = 8; // Windows
}

// Información básica del sistema operativo.
message SystemInfo {
  string os = 1;                 // linux, darwin, windows
  string os_version = 2;         // Versión del SO (ej. 22.04, 13.5)
  string architecture = 3;       // amd64, arm64, etc.
  PackageManager package_manager = 4;
  string package_manager_version = 5;
}

// Representación de un paquete del sistema.
message SystemPackage {
  string name = 1;
  string version = 2;
  string architecture = 3;
  string source = 4;             // repositorio/origin (opcional)
  string status = 5;             // installed, upgradable, etc.
  int64 installed_size = 6;      // Tamaño instalado en bytes (0 si no aplica)
  string summary = 7;            // Descripción corta (opcional)
}

// ---------- ListPackages ----------

message ListPackagesRequest {
  string query = 1;
  bool upgradable_only = 2;
}

message ListPackagesResponse {
  repeated SystemPackage packages = 1;
  int32 total = 2;
}

// ---------- RefreshPackages ----------

message RefreshPackagesRequest {
  bool dry_run = 1;
}

message RefreshPackagesResponse {
  bool success = 1;
  string output = 2;
  repeated SystemPackage upgradable_packages = 3;
  int32 upgradable_count = 4;
}

// ---------- UpgradePackages ----------

message UpgradePackagesRequest {
  bool dry_run = 1;
  bool auto_confirm = 2;
  repeated string packages = 3;
}

message UpgradePackagesResponse {
  bool success = 1;
  string output = 2;
  int32 upgraded_count = 3;
  int32 installed_count = 4;
  int32 removed_count = 5;
}

// ---------- RemovePackages ----------

message RemovePackagesRequest {
  repeated string packages = 1;
  bool purge = 2;
  bool auto_confirm = 3;
  bool dry_run = 4;
}

message RemovePackagesResponse {
  bool success = 1;
  string output = 2;
  int32 removed_count = 3;
}

// ---------- GetSystemInfo ----------

message GetSystemInfoRequest {}

message GetSystemInfoResponse {
  SystemInfo info = 1;
}

// ---------- Métricas del Host ----------

message HostMetrics {
  double cpu_percent = 1;
  int64 memory_total = 2;
  int64 memory_used = 3;
  double memory_percent = 4;
  int64 disk_total = 5;
  int64 disk_used = 6;
  double disk_percent = 7;
  double load_average = 8;
  int64 uptime_seconds = 9;
  int32 cpu_cores = 10;
  string platform = 11;
  repeated ProcessInfo processes = 12;
  int32 process_count = 13;
  double rx_bytes_per_sec = 14;
  double tx_bytes_per_sec = 15;
  double packets_recv_per_sec = 16;
  double packets_sent_per_sec = 17;
  double rtt_ms = 18;
}

// Información de un proceso del sistema operativo.
message ProcessInfo {
  int32 pid = 1;
  string name = 2;
  double cpu_percent = 3;
  double memory_percent = 4;
  int64 memory_bytes = 5;
}

// ---------- SearchProcesses ----------

message SearchProcessesRequest {
  string query = 1;
  bool search_by_pid = 2;
  int32 limit = 3;
}

message SearchProcessesResponse {
  repeated ProcessInfo processes = 1;
  int32 total = 2;
}
